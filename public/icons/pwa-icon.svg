<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#58CC02"/>
      <stop offset="100%" stopColor="#46A302"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle glow inner ring -->
  <circle cx="256" cy="270" r="190" fill="#FFFFFF" opacity="0.08"/>

  <!-- Character Group centered -->
  <g transform="translate(256, 260) scale(3.2)" filter="url(#shadow)">
    <!-- Shadow underneath -->
    <ellipse cx="0" cy="52" rx="36" ry="7" fill="rgba(0,0,0,0.18)"/>

    <!-- Wings Left & Right -->
    <ellipse cx="-35" cy="10" rx="12" ry="20" fill="#3B8C01" transform="rotate(-25 -35 10)"/>
    <ellipse cx="35" cy="10" rx="12" ry="20" fill="#3B8C01" transform="rotate(25 35 10)"/>

    <!-- Plump Body -->
    <circle cx="0" cy="8" r="42" fill="#58CC02"/>

    <!-- Cream Belly -->
    <ellipse cx="0" cy="18" rx="28" ry="24" fill="#FFFBEB"/>

    <!-- Blushing Pink Cheeks -->
    <circle cx="-24" cy="14" r="6" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="24" cy="14" r="6" fill="#FCA5A5" opacity="0.8"/>

    <!-- Big Eyes -->
    <circle cx="-16" cy="-4" r="10" fill="#FFFFFF"/>
    <circle cx="-16" cy="-4" r="6" fill="#1E293B"/>
    <circle cx="-18" cy="-7" r="2.5" fill="#FFFFFF"/>

    <circle cx="16" cy="-4" r="10" fill="#FFFFFF"/>
    <circle cx="16" cy="-4" r="6" fill="#1E293B"/>
    <circle cx="14" cy="-7" r="2.5" fill="#FFFFFF"/>

    <!-- Beak -->
    <polygon points="0,0 -8,9 8,9" fill="#FF9600"/>
    <polygon points="0,14 -6,9 6,9" fill="#E08500"/>

    <!-- Peci Hitam Emas -->
    <path d="M -20 -28 C -20 -40, 20 -40, 20 -28 Z" fill="#1E293B"/>
    <rect x="-21" y="-30" width="42" height="5" rx="2" fill="#FFC800"/>

    <!-- Little Feet -->
    <ellipse cx="-12" cy="47" rx="6" ry="4" fill="#FF9600"/>
    <ellipse cx="12" cy="47" rx="6" ry="4" fill="#FF9600"/>
  </g>
</svg>
